name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: eil
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      EIL_DATABASE_URL: postgresql://postgres@localhost:5432/eil
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: migrations + fixture ingest + search + eval smoke
        run: |
          pnpm -s eil db migrate
          pnpm -s eil ingest confluence --fixture tests/fixtures/confluence_page.json
          pnpm -s eil ingest jira --fixture tests/fixtures/jira_issue.json
          pnpm -s eil search "PAY-981" | grep -q "jira:issue:PAY-981"
          pnpm -s eil search "payment retries" | grep -q "confluence:page:12345"
          pnpm -s eil eval --min-recall 1.0
          pnpm -s eil tools | grep -q '"search_docs"'
