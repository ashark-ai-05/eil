# O-1 alert rules — the designed tripwires. Cursor staleness is the #1
# connector-rot tripwire; zero-result spikes are the adoption killer; recall
# drops also gate CI (eil eval --min-recall), this alert covers drift between
# releases.
#
# Three defects fixed here, all of which made this file decorative:
#
#   1. There were no contactPoints and no notification policy, so every rule
#      fired into a void. Grafana unified alerting needs BOTH to deliver
#      anything; rules alone are inert.
#   2. Every rule had `noDataState: OK`, which inverts the worst case — a
#      connector that has NEVER synced, or a metrics schema missing after a
#      failed migration, returns no rows and was reported healthy. Total absence
#      of ingestion was the greenest state on the board.
#   3. The cursor-staleness query defaulted a missing value to 0 hours, i.e.
#      "perfectly fresh", for the same reason.
apiVersion: 1
groups:
  - orgId: 1
    name: eil
    folder: EIL
    interval: 5m
    rules:
      - uid: eil-cursor-stale
        title: Connector cursor stale > 24h
        condition: C
        for: 1h
        noDataState: NoData
        execErrState: Alerting
        annotations:
          summary: "A connector's sync cursor hasn't advanced in over 24 hours — it has silently died."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: eil-pg
            model:
              format: table
              rawSql: "SELECT coalesce(max(age_hours), 999999) AS value FROM metrics.vw_connector_health"
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [24] }
      - uid: eil-zero-result-spike
        title: Zero-result rate spike (today)
        condition: C
        for: 30m
        noDataState: NoData
        execErrState: Alerting
        annotations:
          summary: "More than 30% of today's searches return nothing — corpus gap or router regression."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: eil-pg
            model:
              format: table
              rawSql: "SELECT coalesce(max(zero_rate), 0) AS value FROM metrics.vw_zero_results WHERE day = now()::date AND calls >= 10"
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.3] }
      - uid: eil-recall-drop
        title: Eval recall below baseline
        condition: C
        for: 0s
        noDataState: NoData
        execErrState: Alerting
        annotations:
          summary: "Latest recorded eval run fell below 0.9 mean recall — retrieval regressed."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: eil-pg
            model:
              format: table
              rawSql: "SELECT mean_recall AS value FROM metrics.vw_eval_trend ORDER BY at DESC LIMIT 1"
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [0.9] }

# Without these two blocks nothing above is ever delivered. The webhook is a
# placeholder — point it at Slack, PagerDuty, or an email contact point — but it
# must EXIST, because an undeliverable alert is indistinguishable from no alert.
contactPoints:
  - orgId: 1
    name: eil-default
    receivers:
      - uid: eil-webhook
        type: webhook
        disableResolveMessage: false
        settings:
          url: ${EIL_ALERT_WEBHOOK_URL:-http://localhost:9099/eil-alerts}
          httpMethod: POST

policies:
  - orgId: 1
    receiver: eil-default
    # Group by rule so a connector problem and a recall regression arrive
    # separately rather than being collapsed into one notification.
    group_by: [alertname, grafana_folder]
    group_wait: 30s
    group_interval: 5m
    # Long, because these are slow-moving conditions. A stale cursor re-notifying
    # every five minutes trains people to mute the channel, which is the same
    # outcome as having no alerts.
    repeat_interval: 12h
