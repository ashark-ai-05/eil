# Optional dashboard for EIL. **EIL itself needs no Docker** — this file exists
# only so the provisioning under grafana/ can actually be mounted somewhere.
#
# provider.yaml points at /var/lib/grafana/dashboards, which is Grafana's path
# INSIDE the container; the JSON lives in grafana/dashboards/ in this repo. That
# mapping was documented nowhere, so the dashboards silently never loaded. The
# mounts below are the mapping.
#
#   docker compose -f observability/docker-compose.yml up
#   open http://127.0.0.1:3000   (anonymous read-only; bound to loopback)
#
# SECURITY: this is a LOCAL dashboard. It binds 127.0.0.1, grants anonymous
# Viewer rather than Admin, and disables Explore, because Grafana Admin plus a
# Postgres datasource is arbitrary SQL against the EIL database. Before running
# it anywhere shared: give the datasource a READ-ONLY Postgres role (it
# currently reuses the application user), set GF_SECURITY_ADMIN_PASSWORD, and
# turn anonymous access off.
#
# Against PGlite there is no server to point a datasource at, so this is for the
# Postgres backend: `eil db embedded` or a system/org instance.

services:
  grafana:
    image: grafana/grafana:11.3.0
    container_name: eil-grafana
    ports:
      # LOOPBACK ONLY. "3000:3000" publishes on 0.0.0.0 — every interface — and
      # combined with the anonymous access below that put the whole exposure on
      # the LAN. A comment saying "local only" does not bind a socket.
      - "127.0.0.1:3000:3000"
    environment:
      # Anonymous VIEWER, not Admin. Admin can edit datasources and, with a
      # Postgres datasource, run arbitrary SQL through Explore — against the
      # application's own DB user. That reaches audit_log (every query every
      # user ran), the entire documents.body corpus, and the QUARANTINED rows
      # with their retained secrets, which are precisely what the ACL-filtered
      # read path excludes. Shipping secret quarantine and then handing the
      # secrets out over unauthenticated HTTP is not a trade-off, it is a bug.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # Explore is the arbitrary-SQL surface; the dashboards do not need it.
      GF_EXPLORE_ENABLED: "false"
      # Leave a real login available rather than removing the only way to
      # authenticate. Change the password before exposing this anywhere.
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-eil-local-only}
      # These are exactly what provisioning/datasources/eil.yaml reads — no
      # more. EIL_PG_HOST is a combined host:port there, not a bare host, and
      # the datasource declares no password field, so inventing one here would
      # be config that silently does nothing.
      EIL_PG_HOST: ${EIL_PG_HOST:-host.docker.internal:5433}
      EIL_PG_USER: ${EIL_PG_USER:-eil}
      # Where alerts are delivered. Without a reachable receiver the rules are
      # inert — which is the defect the alerting fix addressed.
      EIL_ALERT_WEBHOOK_URL: ${EIL_ALERT_WEBHOOK_URL:-http://localhost:9099/eil-alerts}
    volumes:
      # Provisioning: datasource, dashboard provider, and the alert rules with
      # their contact point and notification policy.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # The path provider.yaml names. This is the mount that was missing.
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    extra_hosts:
      # Lets the container reach a Postgres running on the host, which is where
      # `eil db embedded` puts it.
      - "host.docker.internal:host-gateway"
